<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Espace Organisateur — PrestigeInvites</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --gold:        #c9a96e;
            --gold-light:  #e0c898;
            --gold-dim:    rgba(201,169,110,0.15);
            --gold-border: rgba(201,169,110,0.35);

            /* Palette : brun-tabac moyen — ni blanc ni noir */
            --page-bg:   #2e2820;
            --surface:   #3a3228;
            --surface2:  #443c30;
            --border:    rgba(201,169,110,0.2);
            --border-soft: rgba(201,169,110,0.12);

            --text:      #f5eddf;
            --text-mid:  #d4c4a8;
            --text-muted:#a89070;
            --text-dim:  #7a6a52;

            --danger:    #d47070;
            --success:   #7ab88a;
        }

        body {
            background: var(--page-bg);
            color: var(--text);
            font-family: 'Jost', sans-serif;
            font-weight: 300;
            min-height: 100vh;
        }

        .page-wrap { max-width: 1140px; margin: 0 auto; padding: 0 1.5rem 4rem; }

        /* ========== BRAND HEADER ========== */
        .brand-header {
            text-align: center;
            padding: 2.8rem 0 2.2rem;
            border-bottom: 1px solid var(--border-soft);
            margin-bottom: 2rem;
        }
        .brand-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem; font-weight: 300; font-style: italic;
            color: var(--text); letter-spacing: 0.04em;
        }
        .brand-logo span { color: var(--gold); }
        .brand-tagline {
            font-size: 9px; font-weight: 600; letter-spacing: 0.42em;
            text-transform: uppercase; color: var(--text-dim); margin-top: 6px;
        }
        .brand-orn { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 1.2rem; }
        .orn-line  { width: 48px; height: 1px; background: var(--gold-border); }
        .orn-dia   { width: 5px; height: 5px; border: 1.5px solid var(--gold); transform: rotate(45deg); }

        /* ========== FORM ELEMENTS ========== */
        .f-group { margin-bottom: 1.2rem; }
        .f-label {
            display: block; font-size: 8px; font-weight: 600;
            letter-spacing: 0.32em; text-transform: uppercase;
            color: var(--text-muted); margin-bottom: 7px;
        }
        .f-input {
            width: 100%;
            background: rgba(255,255,255,0.07);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 0.78rem 1rem;
            font-family: 'Jost', sans-serif;
            font-size: 14px; font-weight: 300;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s, background 0.2s;
            -webkit-appearance: none;
        }
        .f-input:focus { border-color: var(--gold); background: rgba(201,169,110,0.07); }
        .f-input::placeholder { color: var(--text-dim); }
        .f-input[type="color"]  { height: 42px; padding: 4px 6px; cursor: pointer; }
        .f-input[type="file"]   { padding: 0.5rem 0.8rem; font-size: 12px; cursor: pointer; }
        .f-hint { font-size: 10px; color: var(--text-dim); margin-top: 4px; }
        .f-row  { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .btn-primary {
            width: 100%; padding: 0.95rem;
            background: var(--gold); border: none; border-radius: 3px;
            color: #1e1a14;
            font-family: 'Jost', sans-serif; font-size: 9px; font-weight: 600;
            letter-spacing: 0.38em; text-transform: uppercase;
            cursor: pointer; transition: all 0.2s; margin-top: 0.4rem;
        }
        .btn-primary:hover { background: var(--gold-light); }
        .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
        .btn-primary.edit-mode { background: #a07840; color: #fff; }
        .btn-primary.edit-mode:hover { background: #b88a50; }

        .btn-ghost {
            width: 100%; padding: 0.78rem;
            background: transparent; border: 1px solid var(--border); border-radius: 3px;
            color: var(--text-muted);
            font-family: 'Jost', sans-serif; font-size: 9px; font-weight: 500;
            letter-spacing: 0.22em; text-transform: uppercase;
            cursor: pointer; transition: all 0.2s; margin-top: 0.4rem;
        }
        .btn-ghost:hover { background: var(--surface2); }

        .btn-link {
            background: none; border: none; cursor: pointer;
            font-size: 11px; color: var(--gold); letter-spacing: 0.07em;
            text-decoration: underline; text-underline-offset: 3px;
            font-family: 'Jost', sans-serif;
            display: block; text-align: center; margin-top: 1.2rem;
            transition: opacity 0.2s;
        }
        .btn-link:hover { opacity: 0.7; }

        /* ========== AUTH BOX ========== */
        #auth-box {
            max-width: 440px; margin: 2rem auto 0;
            background: var(--surface);
            border: 1px solid var(--gold-border);
            border-radius: 6px; overflow: hidden;
            box-shadow: 0 8px 40px rgba(0,0,0,0.35);
        }
        .auth-top-bar { height: 3px; background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent); }
        .auth-inner { padding: 2.5rem; }
        #auth-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.9rem; font-weight: 400; text-align: center; margin-bottom: 0.3rem;
        }
        .auth-sub { text-align: center; font-size: 12px; color: var(--text-muted); margin-bottom: 2rem; }

        /* ========== DASHBOARD ========== */
        #dashboard-box { display: none; }

        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 5px; padding: 1rem 1.5rem; margin-bottom: 2rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.25);
        }
        .topbar-name  { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; font-style: italic; color: var(--gold); }
        .topbar-email { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        .btn-logout {
            background: rgba(212,112,112,0.1); border: 1px solid rgba(212,112,112,0.25);
            border-radius: 3px; color: var(--danger);
            font-family: 'Jost', sans-serif; font-size: 9px; font-weight: 500;
            letter-spacing: 0.2em; text-transform: uppercase;
            padding: 0.55rem 1rem; cursor: pointer; transition: all 0.2s;
        }
        .btn-logout:hover { background: rgba(212,112,112,0.2); }

        /* Grid desktop */
        .dash-grid { display: grid; grid-template-columns: 360px 1fr; gap: 2rem; align-items: start; }

        /* ========== FORM CARD ========== */
        .form-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 6px; overflow: hidden;
            position: sticky; top: 1.5rem;
            box-shadow: 0 4px 24px rgba(0,0,0,0.25);
        }
        .form-top-bar { height: 3px; background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent); }
        .form-card-head {
            padding: 1.2rem 1.5rem; border-bottom: 1px solid var(--border-soft);
            background: var(--gold-dim);
            display: flex; align-items: center; gap: 10px;
        }
        .form-card-head h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; font-weight: 400; }
        .form-card-head i  { color: var(--gold); font-size: 0.9rem; }
        .form-card-body    { padding: 1.5rem; }
        .form-sep          { height: 1px; background: var(--border-soft); margin: 1.2rem 0; }

        /* ========== EVENTS LIST ========== */
        .list-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 1.2rem; }
        .list-head h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 400; }
        .events-count { font-size: 10px; color: var(--text-muted); letter-spacing: 0.1em; }
        #events-list { display: flex; flex-direction: column; gap: 1rem; }

        /* ========== EVENT CARD ========== */
        .ev-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 5px; overflow: hidden;
            transition: box-shadow 0.2s, border-color 0.2s;
        }
        .ev-card:hover { border-color: var(--gold-border); box-shadow: 0 6px 24px rgba(0,0,0,0.3); }
        .ev-card-body { padding: 1.2rem 1.4rem; display: flex; gap: 1rem; align-items: flex-start; }

        .ev-type-badge {
            display: inline-block; font-size: 7px; font-weight: 600;
            letter-spacing: 0.32em; text-transform: uppercase;
            color: #1e1a14; background: var(--gold);
            padding: 3px 10px; border-radius: 1px; margin-bottom: 6px;
        }
        .ev-info  { flex: 1; min-width: 0; }
        .ev-title {
            font-family: 'Cormorant Garamond', serif; font-size: 1.35rem; font-weight: 400;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px;
        }
        .ev-meta  { font-size: 11px; color: var(--text-muted); display: flex; flex-direction: column; gap: 3px; }
        .ev-meta span { display: flex; align-items: center; gap: 7px; }
        .ev-meta i { color: var(--gold); font-size: 10px; width: 10px; flex-shrink: 0; }

        .ev-stats { display: flex; border: 1px solid var(--border); border-radius: 3px; overflow: hidden; flex-shrink: 0; align-self: center; }
        .stat-b   { text-align: center; padding: 0.65rem 1rem; border-right: 1px solid var(--border); }
        .stat-b:last-child { border-right: none; }
        .stat-n   { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; font-weight: 600; line-height: 1; display: block; }
        .stat-n.g { color: var(--success); }
        .stat-n.r { color: var(--danger); }
        .stat-n.o { color: var(--gold); }
        .stat-l   { font-size: 7px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-dim); margin-top: 3px; display: block; }

        .ev-actions {
            border-top: 1px solid var(--border-soft); padding: 0.75rem 1.4rem;
            display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
            background: rgba(0,0,0,0.1);
        }
        .slug-chip {
            font-size: 10px; font-family: monospace; color: var(--text-dim);
            background: var(--surface2); border: 1px solid var(--border-soft);
            padding: 3px 8px; border-radius: 2px;
            flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .act-btn {
            display: flex; align-items: center; justify-content: center; gap: 5px;
            padding: 0.45rem 0.85rem; border-radius: 2px;
            border: 1px solid var(--border); background: transparent; color: var(--text-muted);
            font-family: 'Jost', sans-serif; font-size: 9px; font-weight: 500;
            letter-spacing: 0.12em; text-transform: uppercase;
            cursor: pointer; transition: all 0.18s; text-decoration: none; white-space: nowrap;
        }
        .act-btn:hover          { background: var(--surface2); color: var(--text); }
        .act-btn.gold           { border-color: var(--gold-border); color: var(--gold); }
        .act-btn.gold:hover     { background: var(--gold-dim); }
        .act-btn.amber          { border-color: rgba(192,140,60,0.35); color: #c8a060; }
        .act-btn.amber:hover    { background: rgba(192,140,60,0.12); }
        .act-btn.red            { border-color: rgba(212,112,112,0.3); color: var(--danger); }
        .act-btn.red:hover      { background: rgba(212,112,112,0.1); }

        /* Tiroir RSVP */
        .rsvp-drawer        { display: none; }
        .rsvp-drawer.open   { display: block; }
        .rsvp-inner         { border-top: 1px solid var(--border-soft); padding: 1.2rem 1.4rem; background: rgba(0,0,0,0.15); }
        .rsvp-inner h5      { font-size: 8px; font-weight: 600; letter-spacing: 0.32em; text-transform: uppercase; color: var(--gold); margin-bottom: 1rem; }
        .rsvp-tbl           { width: 100%; border-collapse: collapse; }
        .rsvp-tbl th        { font-size: 7px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-dim); text-align: left; padding: 0 0 0.7rem; border-bottom: 1px solid var(--border); }
        .rsvp-tbl td        { font-size: 12px; color: var(--text-mid); padding: 0.55rem 0; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
        .rsvp-pill          { display: inline-block; font-size: 7px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; padding: 2px 8px; border-radius: 1px; }
        .rsvp-pill.p        { background: rgba(122,184,138,0.15); color: var(--success); border: 1px solid rgba(122,184,138,0.3); }
        .rsvp-pill.a        { background: rgba(212,112,112,0.12); color: var(--danger); border: 1px solid rgba(212,112,112,0.25); }

        /* Empty state */
        .empty-state        { text-align: center; padding: 3.5rem 1rem; background: var(--surface); border: 1px dashed var(--border); border-radius: 5px; }
        .empty-state i      { font-size: 2rem; color: var(--text-dim); display: block; margin-bottom: 1rem; }
        .empty-state p      { font-size: 13px; color: var(--text-muted); }

        footer { text-align: center; padding: 2rem 0 0; font-size: 10px; letter-spacing: 0.18em; color: var(--text-dim); border-top: 1px solid var(--border-soft); margin-top: 3rem; }
        footer span { color: var(--text-muted); }

        /* =============================================
           RESPONSIVE MOBILE
        ============================================= */
        @media (max-width: 840px) {
            .dash-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 640px) {
            .page-wrap { padding: 0 0 5.5rem; }
            .brand-header { padding: 1.5rem 1rem 1.2rem; margin-bottom: 0; }
            .brand-logo   { font-size: 1.6rem; }

            /* Topbar compact */
            .topbar { border-radius: 0; border-left: none; border-right: none; border-top: none; padding: 0.8rem 1rem; margin-bottom: 0; }
            .btn-logout { padding: 0.4rem 0.7rem; font-size: 8px; }

            /* Cache le grid, on gère via tabs */
            .dash-grid { display: block !important; }

            /* Panneaux onglets — le JS gère display, CSS gère juste le padding */
            #panel-form, #panel-list { padding: 1rem; }

            /* Barre onglets fixe en bas */
            .mobile-tabs {
                display: flex !important;
                position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
                background: var(--surface);
                border-top: 1px solid var(--gold-border);
                box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
            }
            .tab-btn {
                flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
                gap: 4px; padding: 0.75rem 0.5rem;
                background: none; border: none; border-top: 2px solid transparent;
                cursor: pointer; font-family: 'Jost', sans-serif;
                font-size: 8px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase;
                color: var(--text-dim); transition: color 0.2s, border-color 0.2s;
            }
            .tab-btn i      { font-size: 1.1rem; }
            .tab-btn.active { color: var(--gold); border-top-color: var(--gold); }

            /* Formulaire mobile */
            .form-card { position: static; box-shadow: none; border-radius: 5px; }
            .form-card-body { padding: 1rem; }
            .f-row { grid-template-columns: 1fr; }
            .f-input { padding: 0.88rem 1rem; font-size: 15px; }

            /* Liste mobile */
            .list-head { padding: 0 0 0.4rem; }
            .list-head h3 { font-size: 1.2rem; }

            /* Carte événement mobile */
            .ev-card-body { flex-direction: column; padding: 1rem; gap: 0.8rem; }
            .ev-title     { font-size: 1.15rem; }

            /* Stats pleine largeur */
            .ev-stats  { width: 100%; }
            .stat-b    { flex: 1; padding: 0.6rem 0.4rem; }
            .stat-n    { font-size: 1.2rem; }

            /* Actions en grille 2 col */
            .ev-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0.8rem 1rem; }
            .slug-chip  { grid-column: 1 / -1; }
            .act-btn    { justify-content: center; padding: 0.65rem; font-size: 10px; }

            /* Masquer colonne message dans tableau RSVP */
            .rsvp-tbl th:last-child,
            .rsvp-tbl td:last-child { display: none; }
        }
    </style>
</head>
<body>
<div class="page-wrap">

    <!-- Brand -->
    <div class="brand-header">
        <div class="brand-logo">Prestige<span>Invites</span></div>
        <div class="brand-tagline">Espace Organisateur</div>
        <div class="brand-orn">
            <div class="orn-line"></div><div class="orn-dia"></div><div class="orn-line"></div>
        </div>
    </div>

    <!-- ===== AUTH ===== -->
    <div id="auth-box">
        <div class="auth-top-bar"></div>
        <div class="auth-inner">
            <h2 id="auth-title">Connexion</h2>
            <p class="auth-sub">Gérez vos événements et suivez vos invités</p>
            <form id="auth-form">
                <div class="f-group">
                    <label class="f-label">Adresse e-mail</label>
                    <input type="email" id="auth-email" required placeholder="votre@email.com" class="f-input">
                </div>
                <div class="f-group">
                    <label class="f-label">Mot de passe</label>
                    <input type="password" id="auth-password" required placeholder="••••••••" class="f-input">
                </div>
                <button type="submit" id="btn-auth" class="btn-primary">Se connecter</button>
            </form>
            <button onclick="toggleAuthMode()" id="btn-toggle-mode" class="btn-link">Pas encore de compte ? S'inscrire</button>
        </div>
    </div>

    <!-- ===== DASHBOARD ===== -->
    <div id="dashboard-box">

        <!-- Topbar -->
        <div class="topbar">
            <div>
                <div class="topbar-name">PrestigeInvites</div>
                <div class="topbar-email" id="user-email">…</div>
            </div>
            <button onclick="logout()" class="btn-logout">
                <i class="fa-solid fa-power-off"></i>&nbsp; Déconnexion
            </button>
        </div>

        <!-- Barre onglets mobile (invisible sur desktop via CSS) -->
        <div class="mobile-tabs" style="display:none;" id="mobile-tabs">
            <button class="tab-btn active" id="tab-list-btn" onclick="switchTab('list')">
                <i class="fa-solid fa-list"></i>
                Invitations
            </button>
            <button class="tab-btn" id="tab-form-btn" onclick="switchTab('form')">
                <i class="fa-solid fa-circle-plus"></i>
                Créer
            </button>
        </div>

        <div class="dash-grid">

            <!-- Panneau Formulaire -->
            <div id="panel-form">
                <div class="form-card">
                    <div class="form-top-bar"></div>
                    <div class="form-card-head">
                        <i class="fa-solid fa-circle-plus" id="form-icon"></i>
                        <h3 id="form-heading">Créer un événement</h3>
                    </div>
                    <div class="form-card-body">
                        <form id="event-form">
                            <div class="f-group">
                                <label class="f-label">Titre de l'événement *</label>
                                <input type="text" id="event-title-input" required placeholder="Ex : Mariage de Marc & Sophie" class="f-input">
                            </div>
                            <div class="f-row">
                                <div class="f-group">
                                    <label class="f-label">Qui invite ? (hôte)</label>
                                    <input type="text" id="event-host-input" placeholder="La famille CODJO…" class="f-input">
                                </div>
                                <div class="f-group">
                                    <label class="f-label">Type d'événement *</label>
                                    <input type="text" id="event-type-input" required placeholder="Mariage, Gala, Obsèques…" class="f-input">
                                    <p class="f-hint">Saisir librement</p>
                                </div>
                            </div>
                            <div class="f-group">
                                <label class="f-label">Phrase d'invitation</label>
                                <input type="text" id="event-phrase-input" placeholder="vous prie d'assister à…" class="f-input">
                            </div>
                            <div class="form-sep"></div>
                            <div class="f-row">
                                <div class="f-group">
                                    <label class="f-label">Date & heure *</label>
                                    <input type="datetime-local" id="event-date-input" required class="f-input">
                                </div>
                                <div class="f-group">
                                    <label class="f-label">Slug (lien court) *</label>
                                    <input type="text" id="event-slug-input" required placeholder="mariage-marc" class="f-input">
                                    <p class="f-hint" id="slug-help">Un id unique sera ajouté.</p>
                                </div>
                            </div>
                            <div class="f-group">
                                <label class="f-label">Lieu *</label>
                                <input type="text" id="event-location-input" required placeholder="Ex : Majestic, Cotonou" class="f-input">
                            </div>
                            <div class="f-group">
                                <label class="f-label">Lien GPS Google Maps</label>
                                <input type="url" id="event-maps-input" placeholder="https://maps.google.com/…" class="f-input">
                            </div>
                            <div class="form-sep"></div>
                            <div class="f-group">
                                <label class="f-label" id="file-label">Image de fond (max 2 Mo)</label>
                                <input type="file" id="event-bg-file" accept="image/*" class="f-input">
                            </div>
                            <button type="submit" id="btn-submit-event" class="btn-primary">Générer l'invitation</button>
                            <button type="button" id="btn-cancel-edit" onclick="resetFormToCreateMode()" class="btn-ghost" style="display:none;">Annuler la modification</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Panneau Liste -->
            <div id="panel-list">
                <div class="list-head">
                    <h3>Mes invitations</h3>
                    <span class="events-count" id="events-count"></span>
                </div>
                <div id="events-list">
                    <div class="empty-state">
                        <i class="fa-regular fa-envelope"></i>
                        <p>Aucune invitation créée pour le moment.</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <footer><p>Développé par <span>Alouphaa</span> &copy; 2026</p></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL      = "https://yukywftxppvgywpsapmh.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1a3l3ZnR4cHB2Z3l3cHNhcG1oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MDUyMTcsImV4cCI6MjA5NTk4MTIxN30.d-jB_JTMnHRyZxrZLD3eEgppt6P4cbsk0qZ7VKSMdtQ";
    const supabaseClient    = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let isSignUpMode = false, currentUser = null;
    let isEditMode = false, editEventId = null, editExistingImageUrl = null;
    let localEventsArray = [];

    /* ===== AUTH ===== */
    function toggleAuthMode() {
        isSignUpMode = !isSignUpMode;
        document.getElementById('auth-title').textContent      = isSignUpMode ? "Inscription"      : "Connexion";
        document.getElementById('btn-auth').textContent        = isSignUpMode ? "Créer mon compte" : "Se connecter";
        document.getElementById('btn-toggle-mode').textContent = isSignUpMode
            ? "Déjà un compte ? Se connecter" : "Pas encore de compte ? S'inscrire";
    }

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('auth-email').value;
        const password = document.getElementById('auth-password').value;
        const btn = document.getElementById('btn-auth');
        btn.textContent = "Traitement…"; btn.disabled = true;

        if (isSignUpMode) {
            const { error } = await supabaseClient.auth.signUp({ email, password });
            if (error) alert("Erreur : " + error.message);
            else alert("Inscription réussie ! Vérifiez vos e-mails.");
        } else {
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) alert("Erreur de connexion : " + error.message);
            else checkUserSession();
        }
        btn.disabled = false;
        btn.textContent = isSignUpMode ? "Créer mon compte" : "Se connecter";
    });

    async function checkUserSession() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
            currentUser = session.user;
            document.getElementById('auth-box').style.display      = 'none';
            document.getElementById('dashboard-box').style.display = 'block';
            document.getElementById('user-email').textContent      = currentUser.email;
            initMobileTabs();
            loadUserEvents();
        } else {
            document.getElementById('auth-box').style.display      = '';
            document.getElementById('dashboard-box').style.display = 'none';
        }
    }

    async function logout() {
        await supabaseClient.auth.signOut();
        currentUser = null;
        checkUserSession();
    }

    /* ===== MOBILE TABS ===== */
    function isMobile() { return window.innerWidth <= 640; }

    function initMobileTabs() {
        const tabs     = document.getElementById('mobile-tabs');
        const pForm    = document.getElementById('panel-form');
        const pList    = document.getElementById('panel-list');

        if (isMobile()) {
            tabs.style.display  = 'flex';
            // Afficher la liste par défaut, cacher le formulaire
            pList.style.display = 'block';
            pForm.style.display = 'none';
            document.getElementById('tab-list-btn').classList.add('active');
            document.getElementById('tab-form-btn').classList.remove('active');
        } else {
            // Desktop : tout visible, pas de tabs
            tabs.style.display  = 'none';
            pForm.style.display = 'block';
            pList.style.display = 'block';
        }
    }

    function switchTab(tab) {
        const pForm = document.getElementById('panel-form');
        const pList = document.getElementById('panel-list');
        const bForm = document.getElementById('tab-form-btn');
        const bList = document.getElementById('tab-list-btn');

        if (tab === 'form') {
            pForm.style.display = 'block';
            pList.style.display = 'none';
            bForm.classList.add('active');
            bList.classList.remove('active');
        } else {
            pForm.style.display = 'none';
            pList.style.display = 'block';
            bList.classList.add('active');
            bForm.classList.remove('active');
        }
    }

    window.addEventListener('resize', initMobileTabs);

    /* ===== FORMATAGE DATE ===== */
    function formatFrenchDate(dateString) {
        if (!dateString) return "—";
        return new Date(dateString).toLocaleDateString('fr-FR', {
            year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });
    }

    /* ===== CHARGEMENT ÉVÉNEMENTS ===== */
    async function loadUserEvents() {
        const { data: events, error } = await supabaseClient
            .from('evenements')
            .select('*, rsvp(*)')
            .eq('user_id', currentUser.id)
            .order('created_at', { ascending: false });

        const container = document.getElementById('events-list');

        if (error || !events || events.length === 0) {
            container.innerHTML = `<div class="empty-state"><i class="fa-regular fa-envelope"></i><p>Aucune invitation créée pour le moment.</p></div>`;
            document.getElementById('events-count').textContent = '';
            return;
        }

        localEventsArray = events;
        document.getElementById('events-count').textContent = `${events.length} invitation${events.length > 1 ? 's' : ''}`;
        container.innerHTML = '';

        events.forEach(ev => {
            const rsvps         = ev.rsvp || [];
            const presentsCount = rsvps.filter(r => r.presence).length;
            const absentsCount  = rsvps.filter(r => !r.presence).length;
            const totalPlaces   = rsvps.filter(r => r.presence).reduce((s, r) => s + 1 + (r.nombre_accompagnateurs || 0), 0);
            const folderUrl     = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
            const inviteLink    = `${folderUrl}/index.html?e=${ev.slug}`;
            const drawerId      = `drawer-${ev.id}`;

            const rowsHtml = rsvps.length === 0
                ? `<tr><td colspan="4" style="text-align:center;padding:1rem 0;color:var(--text-dim);font-style:italic;font-size:12px;">Aucune réponse pour le moment</td></tr>`
                : rsvps.map(r => `
                    <tr>
                        <td>${r.nom_invite}</td>
                        <td><span class="rsvp-pill ${r.presence ? 'p' : 'a'}">${r.presence ? 'Présent' : 'Absent'}</span></td>
                        <td style="text-align:center;">${r.presence ? (1 + (r.nombre_accompagnateurs || 0)) : 0}</td>
                        <td style="font-style:italic;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${r.commentaire || ''}">${r.commentaire || '—'}</td>
                    </tr>`).join('');

            const div = document.createElement('div');
            div.className = 'ev-card';
            div.innerHTML = `
                <div class="ev-card-body">
                    <div class="ev-info">
                        <span class="ev-type-badge">${ev.type_evenement}</span>
                        <div class="ev-title">${ev.titre}</div>
                        <div class="ev-meta">
                            <span><i class="fa-solid fa-calendar-days"></i>${formatFrenchDate(ev.date_heure)}</span>
                            <span><i class="fa-solid fa-location-dot"></i>${ev.lieu}</span>
                        </div>
                    </div>
                    <div class="ev-stats">
                        <div class="stat-b"><span class="stat-n g">${presentsCount}</span><span class="stat-l">Venant</span></div>
                        <div class="stat-b"><span class="stat-n r">${absentsCount}</span><span class="stat-l">Absents</span></div>
                        <div class="stat-b"><span class="stat-n o">${totalPlaces}</span><span class="stat-l">Places</span></div>
                    </div>
                </div>
                <div class="ev-actions">
                    <span class="slug-chip">/${ev.slug}</span>
                    <a href="${inviteLink}" target="_blank" class="act-btn gold"><i class="fa-solid fa-arrow-up-right-from-square"></i> Voir</a>
                    <button onclick="toggleDrawer('${drawerId}')" class="act-btn"><i class="fa-solid fa-users"></i> Invités</button>
                    <button onclick="copyLink('${inviteLink}')" class="act-btn gold"><i class="fa-solid fa-copy"></i> Copier</button>
                    <button onclick="prepareEditEvent('${ev.id}')" class="act-btn amber"><i class="fa-solid fa-pencil"></i></button>
                    <button onclick="deleteEvent('${ev.id}', '${ev.titre.replace(/'/g, "\\'")}')" class="act-btn red"><i class="fa-solid fa-trash"></i></button>
                </div>
                <div class="rsvp-drawer" id="${drawerId}">
                    <div class="rsvp-inner">
                        <h5><i class="fa-solid fa-list-check" style="margin-right:6px;"></i>Liste des réponses</h5>
                        <div style="overflow-x:auto;">
                            <table class="rsvp-tbl">
                                <thead><tr><th>Nom</th><th>Statut</th><th style="text-align:center;">Pers.</th><th>Message</th></tr></thead>
                                <tbody>${rowsHtml}</tbody>
                            </table>
                        </div>
                    </div>
                </div>`;
            container.appendChild(div);
        });
    }

    function toggleDrawer(id) { document.getElementById(id).classList.toggle('open'); }

    function copyLink(url) {
        navigator.clipboard.writeText(url);
        alert('Lien copié dans le presse-papiers !');
    }

    /* ===== MODIFICATION ===== */
    function prepareEditEvent(id) {
        const event = localEventsArray.find(ev => ev.id === id);
        if (!event) return;
        isEditMode = true; editEventId = event.id; editExistingImageUrl = event.image_fond;

        document.getElementById('form-icon').className      = 'fa-solid fa-pencil';
        document.getElementById('form-heading').textContent = "Modifier l'événement";
        const btn = document.getElementById('btn-submit-event');
        btn.textContent = "Enregistrer les modifications";
        btn.className = "btn-primary edit-mode";
        document.getElementById('btn-cancel-edit').style.display = 'block';

        document.getElementById('event-title-input').value    = event.titre;
        document.getElementById('event-host-input').value     = event.hote || '';
        document.getElementById('event-phrase-input').value   = event.phrase_invitation || '';
        document.getElementById('event-type-input').value     = event.type_evenement;
        document.getElementById('event-location-input').value = event.lieu;
        document.getElementById('event-maps-input').value     = event.lien_maps || '';

        if (event.date_heure) {
            const d = new Date(event.date_heure);
            const iso = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString();
            document.getElementById('event-date-input').value = iso.slice(0, 16);
        }

        const slugInput = document.getElementById('event-slug-input');
        slugInput.value = event.slug.split('-').slice(0, -1).join('-');
        slugInput.disabled = true; slugInput.style.opacity = '0.35';
        document.getElementById('slug-help').textContent = "Lien figé pour ne pas casser les partages.";
        if (event.image_fond) document.getElementById('file-label').textContent = "Remplacer l'image (optionnel)";

        if (isMobile()) switchTab('form');
        else document.getElementById('form-heading').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function resetFormToCreateMode() {
        isEditMode = false; editEventId = null; editExistingImageUrl = null;
        document.getElementById('form-icon').className      = 'fa-solid fa-circle-plus';
        document.getElementById('form-heading').textContent = 'Créer un événement';
        const btn = document.getElementById('btn-submit-event');
        btn.textContent = "Générer l'invitation"; btn.className = "btn-primary";
        document.getElementById('btn-cancel-edit').style.display = 'none';
        const si = document.getElementById('event-slug-input');
        si.disabled = false; si.style.opacity = '1';
        document.getElementById('slug-help').textContent     = "Un id unique sera ajouté.";
        document.getElementById('file-label').textContent   = "Image de fond (max 2 Mo)";
        document.getElementById('event-form').reset();
        if (isMobile()) switchTab('list');
    }

    /* ===== SUPPRESSION ===== */
    async function deleteEvent(id, title) {
        if (!confirm(`⚠️ Supprimer définitivement "${title}" ?\n\nToutes les réponses invités seront effacées.`)) return;
        await supabaseClient.from('rsvp').delete().eq('evenement_id', id);
        const { error } = await supabaseClient.from('evenements').delete().eq('id', id);
        if (error) { alert("Erreur : " + error.message); return; }
        alert("Événement supprimé.");
        if (isEditMode && editEventId === id) resetFormToCreateMode();
        loadUserEvents();
    }

    /* ===== SOUMISSION FORMULAIRE ===== */
    document.getElementById('event-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-submit-event');
        btn.textContent = isEditMode ? "Enregistrement…" : "Création en cours…";
        btn.disabled = true;

        const titre             = document.getElementById('event-title-input').value.trim();
        const type_evenement    = document.getElementById('event-type-input').value.trim();
        const date_heure        = document.getElementById('event-date-input').value;
        const lieu              = document.getElementById('event-location-input').value.trim();
        const lien_maps         = document.getElementById('event-maps-input').value.trim();
        const hote              = document.getElementById('event-host-input').value.trim();
        const phrase_invitation = document.getElementById('event-phrase-input').value.trim();
        const imageFile         = document.getElementById('event-bg-file').files[0];
        let   image_fond        = isEditMode ? editExistingImageUrl : null;

        if (imageFile) {
            if (imageFile.size > 2 * 1024 * 1024) {
                alert("❌ Image trop lourde ! Maximum 2 Mo.");
                document.getElementById('event-bg-file').value = '';
                btn.textContent = isEditMode ? "Enregistrer les modifications" : "Générer l'invitation";
                btn.disabled = false; return;
            }
            const fileExt  = imageFile.name.split('.').pop();
            const filePath = `${currentUser.id}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${fileExt}`;
            const { error: ue } = await supabaseClient.storage.from('fonds-invitations').upload(filePath, imageFile);
            if (ue) { alert("Erreur upload : " + ue.message); btn.disabled = false; return; }
            const { data: pub } = supabaseClient.storage.from('fonds-invitations').getPublicUrl(filePath);
            image_fond = pub.publicUrl;
        }

        const payload = {
            titre, type_evenement, date_heure, lieu,
            lien_maps: lien_maps || null, image_fond,
            hote: hote || null, phrase_invitation: phrase_invitation || null
        };

        if (isEditMode) {
            const { error } = await supabaseClient.from('evenements').update(payload).eq('id', editEventId);
            if (error) alert("Erreur : " + error.message);
            else {
                alert("✨ Événement modifié avec succès !");
                resetFormToCreateMode();
                loadUserEvents();
            }
        } else {
            let rawSlug = document.getElementById('event-slug-input').value.trim().toLowerCase();
            rawSlug = rawSlug.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                             .replace(/[^a-z0-9-]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '') || "evenement";
            const slug = `${rawSlug}-${Math.floor(1000 + Math.random() * 9000)}`;
            const { error } = await supabaseClient.from('evenements').insert([{ ...payload, user_id: currentUser.id, slug }]);
            if (error) alert("Erreur : " + error.message);
            else {
                alert(`🎉 Invitation créée !\nLien : /index.html?e=${slug}`);
                document.getElementById('event-form').reset();
                loadUserEvents();
                if (isMobile()) switchTab('list');
            }
        }

        btn.textContent = isEditMode ? "Enregistrer les modifications" : "Générer l'invitation";
        btn.disabled = false;
    });

    checkUserSession();
</script>
</body>
</html>
