<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Espace Organisateur - Premium</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-white font-sans antialiased min-h-screen p-4 md:p-8">

    <!-- FORMULAIRE D'AUTHENTIFICATION -->
    <div id="auth-box" class="max-w-md mx-auto bg-gray-900 border border-white/10 rounded-3xl p-6 shadow-2xl space-y-6 mt-12">
        <div class="text-center">
            <h2 class="text-2xl font-black tracking-tight" id="auth-title">Connexion Organisateur</h2>
            <p class="text-xs text-gray-400 mt-1">Gérez vos événements et suivez vos invités</p>
        </div>
        <form id="auth-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-gray-400 mb-1">Adresse Email</label>
                <input type="email" id="auth-email" required class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 text-white">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-gray-400 mb-1">Mot de passe</label>
                <input type="password" id="auth-password" required class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 text-white">
            </div>
            <button type="submit" id="btn-auth" class="w-full bg-indigo-600 hover:bg-indigo-700 font-bold py-3 rounded-xl transition text-sm uppercase tracking-wider shadow-lg shadow-indigo-600/20 cursor-pointer">
                Se connecter
            </button>
        </form>
        <div class="text-center pt-2">
            <button onclick="toggleAuthMode()" id="btn-toggle-mode" class="text-xs text-indigo-400 hover:underline cursor-pointer">
                Pas encore de compte ? S'inscrire
            </button>
        </div>
    </div>

    <!-- TABLEAU DE BORD (DASHBOARD) -->
    <div id="dashboard-box" class="max-w-5xl mx-auto space-y-8 hidden">
        
        <!-- En-tête Utilisateur -->
        <div class="flex justify-between items-center bg-gray-900 border border-white/10 p-4 rounded-2xl">
            <div>
                <p class="text-xs text-gray-400 font-medium">Aloupha Cards</p>
                <p id="user-email" class="text-sm font-bold text-indigo-400">...</p>
            </div>
            <button onclick="logout()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 px-4 py-2 rounded-xl text-xs font-bold transition cursor-pointer">
                <i class="fa-solid fa-power-off mr-1"></i> Déconnexion
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <!-- BLOC FORMULAIRE CRÉATION / MODIFICATION -->
            <div class="bg-gray-900 border border-white/10 rounded-3xl p-6 h-fit space-y-4 shadow-xl">
                <h3 id="form-heading" class="text-lg font-bold tracking-tight text-indigo-400 border-b border-white/5 pb-2">
                    <i class="fa-solid fa-circle-plus mr-1"></i> Créer un Événement
                </h3>
                <form id="event-form" class="space-y-3 text-left">
                    
                    <div>
                        <label class="block text-[11px] font-medium text-gray-400 mb-0.5">Titre de l'événement</label>
                        <input type="text" id="event-title-input" required placeholder="Ex: Célébration de la vie de Feu Jean" class="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                    </div>

                    <div>
                        <label class="block text-[11px] font-medium text-gray-400 mb-0.5">Qui invite ? (Hôte)</label>
                        <input type="text" id="event-host-input" placeholder="Ex: La famille CODJO, Marc & Sophie..." class="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-xs text-white placeholder:text-gray-600 focus:outline-none focus:border-indigo-500">
                    </div>

                    <div>
                        <label class="block text-[11px] font-medium text-gray-400 mb-0.5">Phrase d'invitation personnalisée</label>
                        <input type="text" id="event-phrase-input" placeholder="Ex: vous prie d'assister aux obsèques de..." class="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-xs text-white placeholder:text-gray-600 focus:outline-none focus:border-indigo-500">
                    </div>

                    <div>
                        <label class="block text-[11px] font-medium text-gray-400 mb-0.5">Type d'événement</label>
                        <select id="event-type-input" class="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                            <option value="Mariage">🎉 Mariage</option>
                            <option value="Anniversaire">🎂 Anniversaire</option>
                            <option value="Gala / Fête">✨ Gala / Fête</option>
                            <option value="Conférence">💼 Conférence</option>
                            <option value="Obsèques">🕊️ Obsèques</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[11px] font-medium text-gray-400 mb-0.5">Date & Heure</label>
                            <input type="datetime-local" id="event-date-input" required class="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-[11px] font-medium text-gray-400 mb-0.5">Lien personnalisé (Slug)</label>
                            <input type="text" id="event-slug-input" required placeholder="mariage-marc" class="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
                            <p id="slug-help-text" class="text-[9px] text-gray-500 mt-0.5">Un identifiant unique y sera ajouté.</p>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11px] font-medium text-gray-400 mb-0.5">Lieu</label>
                        <input type="text" id="event-location-input" required placeholder="Ex: Majestic, Cotonou" class="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                    </div>

                    <div>
                        <label class="block text-[11px] font-medium text-gray-400 mb-0.5">Lien GPS Google Maps</label>
                        <input type="url" id="event-maps-input" placeholder="https://maps.google.com/..." class="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[11px] font-medium text-gray-400 mb-0.5">Couleur Thème</label>
                            <input type="color" id="event-theme-input" value="#6366f1" class="w-full h-9 bg-black/40 border border-white/10 rounded-xl px-1 py-0.5 cursor-pointer">
                        </div>
                        <div>
                            <label id="file-label" class="block text-[11px] font-medium text-gray-400 mb-0.5">Image de fond (Max 2Mo)</label>
                            <input type="file" id="event-bg-file" accept="image/*" class="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-1.5 text-xs text-white file:mr-2 file:py-1 file:px-2 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer">
                        </div>
                    </div>

                    <button type="submit" id="btn-submit-event" class="w-full bg-indigo-600 hover:bg-indigo-700 font-bold py-2.5 rounded-xl transition text-sm tracking-wide mt-2 cursor-pointer">
                        Générer mon Invitation
                    </button>
                    
                    <button type="button" id="btn-cancel-edit" onclick="resetFormToCreateMode()" class="w-full bg-white/5 hover:bg-white/10 border border-white/10 font-medium py-2 rounded-xl transition text-xs tracking-wide hidden cursor-pointer">
                        Annuler la modification
                    </button>
                </form>
            </div>

            <!-- LISTE DES INVITATIONS ACTIVE -->
            <div class="md:col-span-2 space-y-4">
                <h3 class="text-xl font-black tracking-tight">
                    <i class="fa-solid fa-list text-indigo-400 mr-1"></i> Mes Invitations Actives
                </h3>
                <div id="events-list" class="grid grid-cols-1 gap-4">
                    <p class="text-gray-500 text-sm italic">Aucun événement créé pour le moment.</p>
                </div>
            </div>

        </div>
    </div>
    <footer class="w-full text-center py-8 text-gray-600 text-xs tracking-wide border-t border-white/5 mt-12">
        <p>Développé par <span class="text-gray-400 font-semibold">Alouphaa</span> &copy; 2026</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://yukywftxppvgywpsapmh.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1a3l3ZnR4cHB2Z3l3cHNhcG1oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MDUyMTcsImV4cCI6MjA5NTk4MTIxN30.d-jB_JTMnHRyZxrZLD3eEgppt6P4cbsk0qZ7VKSMdtQ";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isSignUpMode = false;
        let currentUser = null;
        
        // Variables d'état pour la modification
        let isEditMode = false;
        let editEventId = null;
        let editExistingImageUrl = null;

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('auth-title').innerText = isSignUpMode ? "Inscription Nouveau Compte" : "Connexion Organisateur";
            document.getElementById('btn-auth').innerText = isSignUpMode ? "Créer mon compte" : "Se connecter";
            document.getElementById('btn-toggle-mode').innerText = isSignUpMode ? "Déjà un compte ? Se connecter" : "Pas encore de compte ? S'inscrire";
        }

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const btn = document.getElementById('btn-auth');

            btn.innerText = "Traitement...";
            btn.disabled = true;

            if (isSignUpMode) {
                const { data, error } = await supabaseClient.auth.signUp({ email, password });
                if (error) alert("Erreur d'inscription: " + error.message);
                else alert("Inscription réussie ! Vérifiez vos e-mails pour confirmer.");
            } else {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) alert("Erreur de connexion: " + error.message);
                else checkUserSession();
            }
            btn.disabled = false;
            btn.innerText = isSignUpMode ? "Créer mon compte" : "Se connecter";
        });

        async function checkUserSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                document.getElementById('auth-box').classList.add('hidden');
                document.getElementById('dashboard-box').classList.remove('hidden');
                document.getElementById('user-email').innerText = currentUser.email;
                loadUserEvents();
            } else {
                document.getElementById('auth-box').classList.remove('hidden');
                document.getElementById('dashboard-box').classList.add('hidden');
            }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            currentUser = null;
            checkUserSession();
        }

        function formatFrenchDate(dateString) {
            if (!dateString) return "-";
            const options = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            return new Date(dateString).toLocaleDateString('fr-FR', options);
        }

        // Variable globale temporaire pour stocker les objets d'événements chargés
        let localEventsArray = [];

        async function loadUserEvents() {
            const { data: events, error } = await supabaseClient
                .from('evenements')
                .select('*, rsvp(*)') 
                .eq('user_id', currentUser.id)
                .order('created_at', { ascending: false });

            const container = document.getElementById('events-list');
            if (error || !events || events.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-sm italic p-4 bg-gray-900 border border-white/5 rounded-2xl">Vous n'avez pas encore généré d'invitation.</p>`;
                return;
            }

            localEventsArray = events; // Sauvegarde locale pour l'édition rapide
            container.innerHTML = "";
            
            events.forEach(ev => {
                const rsvps = ev.rsvp || [];
                const presentsCount = rsvps.filter(r => r.presence === true).length;
                const absentsCount = rsvps.filter(r => r.presence === false).length;
                
                const totalPersonnesReelles = rsvps
                    .filter(r => r.presence === true)
                    .reduce((sum, r) => sum + 1 + (r.nombre_accompagnateurs || 0), 0);

                const currentFolderUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
                const inviteLink = `${currentFolderUrl}/index.html?e=${ev.slug}`;
                const detailsId = `details-${ev.id}`;

                let rowsHtml = "";
                if (rsvps.length === 0) {
                    rowsHtml = `<tr><td colspan="4" class="text-center text-xs py-4 text-gray-500 italic">Aucune réponse pour le moment</td></tr>`;
                } else {
                    rsvps.forEach(r => {
                        rowsHtml += `
                            <tr class="border-b border-white/5 text-xs text-gray-300">
                                <td class="py-2.5 font-semibold">${r.nom_invite}</td>
                                <td class="py-2.5">
                                    <span class="px-2 py-0.5 rounded text-[10px] font-bold ${r.presence ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}">
                                        ${r.presence ? 'Présent' : 'Absent'}
                                    </span>
                                </td>
                                <td class="py-2.5 text-center">${r.presence ? (1 + (r.nombre_accompagnateurs || 0)) : 0}</td>
                                <td class="py-2.5 max-w-[150px] truncate italic text-gray-400" title="${r.commentaire || ''}">${r.commentaire || '-'}</td>
                            </tr>
                        `;
                    });
                }

                container.innerHTML += `
                    <div class="bg-gray-900 border border-white/10 rounded-2xl overflow-hidden shadow-lg transition duration-200">
                        <div class="p-5 flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div class="space-y-1 flex-1">
                                <div class="flex flex-wrap items-center gap-2">
                                    <span class="text-[10px] px-2.5 py-1 rounded-md font-bold uppercase tracking-wider text-white" style="background-color: ${ev.couleur_theme || '#6366f1'}">${ev.type_evenement}</span>
                                    <span class="text-[10px] text-gray-500 font-mono">/${ev.slug}</span>
                                </div>
                                <h4 class="text-lg font-black pt-1">${ev.titre}</h4>
                                <p class="text-xs text-gray-400"><i class="fa-solid fa-calendar-days mr-1 text-indigo-400"></i> ${formatFrenchDate(ev.date_heure)}</p>
                                <p class="text-xs text-gray-400"><i class="fa-solid fa-location-dot mr-1 text-indigo-400"></i> ${ev.lieu}</p>
                            </div>
                            
                            <!-- Statistiques abrégées -->
                            <div class="flex items-center gap-2 bg-black/20 p-2 rounded-xl border border-white/5 h-fit">
                                <div class="text-center px-3 py-1 border-r border-white/5">
                                    <span class="block text-sm font-black text-green-400">${presentsCount}</span>
                                    <span class="text-[8px] uppercase text-gray-500 font-bold">Venant</span>
                                </div>
                                <div class="text-center px-3 py-1 border-r border-white/5">
                                    <span class="block text-sm font-black text-red-400">${absentsCount}</span>
                                    <span class="text-[8px] uppercase text-gray-500 font-bold">Absents</span>
                                </div>
                                <div class="text-center px-3 py-1">
                                    <span class="block text-sm font-black text-indigo-400">${totalPersonnesReelles}</span>
                                    <span class="text-[8px] uppercase text-gray-500 font-bold">Places</span>
                                </div>
                            </div>

                            <!-- BOUTONS D'ACTION (Voir, Invités, Copier + MODIFIER/SUPPRIMER) -->
                            <div class="flex flex-col gap-1.5 min-w-[160px]">
                                <div class="flex gap-1">
                                    <a href="${inviteLink}" target="_blank" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs px-2.5 py-2 rounded-xl text-center transition flex-1 flex items-center justify-center">
                                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                                    </a>
                                    <button onclick="document.getElementById('${detailsId}').classList.toggle('hidden')" class="bg-gray-800 hover:bg-gray-700 text-white font-bold text-xs px-2.5 py-2 rounded-xl text-center transition flex-1 cursor-pointer" title="Voir les invités">
                                        <i class="fa-solid fa-users"></i>
                                    </button>
                                    <button onclick="prepareEditEvent('${ev.id}')" class="bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 font-bold text-xs px-2.5 py-2 rounded-xl text-center transition flex-1 cursor-pointer" title="Modifier l'événement">
                                        <i class="fa-solid fa-pencil"></i>
                                    </button>
                                    <button onclick="deleteEvent('${ev.id}', '${ev.titre}')" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 font-bold text-xs px-2.5 py-2 rounded-xl text-center transition flex-1 cursor-pointer" title="Supprimer l'événement">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </div>
                                <button onclick="navigator.clipboard.writeText('${inviteLink}'); alert('Lien de l\\'invitation copié !');" class="bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 font-bold text-[10px] px-3 py-1.5 rounded-xl transition cursor-pointer">
                                    <i class="fa-solid fa-copy mr-1"></i> Copier le Lien
                                </button>
                            </div>
                        </div>

                        <!-- Tiroir masqué des Réponses Invités -->
                        <div id="${detailsId}" class="hidden bg-black/30 border-t border-white/5 p-4 transition-all">
                            <h5 class="text-xs font-bold uppercase tracking-wider text-indigo-400 mb-2"><i class="fa-solid fa-list-check mr-1"></i> Liste des réponses</h5>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="border-b border-white/10 text-[10px] uppercase text-gray-500 tracking-wider">
                                            <th class="pb-2">Nom complet</th>
                                            <th class="pb-2">Statut</th>
                                            <th class="pb-2 text-center">Pers.</th>
                                            <th class="pb-2">Message</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${rowsHtml}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // COMMUTER LE FORMULAIRE EN MODE ÉDITION (MISE A JOUR)
        function prepareEditEvent(id) {
            const event = localEventsArray.find(ev => ev.id === id);
            if (!event) return;

            isEditMode = true;
            editEventId = event.id;
            editExistingImageUrl = event.image_fond;

            // Changement visuel des intitulés du formulaire
            document.getElementById('form-heading').innerHTML = `<i class="fa-solid fa-pencil mr-1"></i> Modifier l'Événement`;
            document.getElementById('btn-submit-event').innerText = "Enregistrer les modifications";
            document.getElementById('btn-submit-event').className = "w-full bg-amber-500 hover:bg-amber-600 text-black font-black py-2.5 rounded-xl transition text-sm tracking-wide mt-2 cursor-pointer";
            document.getElementById('btn-cancel-edit').classList.remove('hidden');

            // Pré-remplissage des champs
            document.getElementById('event-title-input').value = event.titre;
            document.getElementById('event-host-input').value = event.hote || "";
            document.getElementById('event-phrase-input').value = event.phrase_invitation || "";
            document.getElementById('event-type-input').value = event.type_evenement;
            document.getElementById('event-location-input').value = event.lieu;
            document.getElementById('event-maps-input').value = event.lien_maps || "";
            document.getElementById('event-theme-input').value = event.couleur_theme || "#6366f1";
            
            // Formatage de la date pour le champ type="datetime-local" (YYYY-MM-DDTHH:MM)
            if (event.date_heure) {
                const d = new Date(event.date_heure);
                const isoStr = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString();
                document.getElementById('event-date-input').value = isoStr.slice(0, 16);
            }

            // Gestion du slug en modification (Désactivé pour ne pas casser les liens déjà partagés)
            const slugInput = document.getElementById('event-slug-input');
            slugInput.value = event.slug.split('-').slice(0, -1).join('-'); // affiche la racine
            slugInput.disabled = true;
            slugInput.classList.add('opacity-40');
            document.getElementById('slug-help-text').innerText = "Le lien unique de cette invitation ne peut plus être changé.";
            
            if (event.image_fond) {
                document.getElementById('file-label').innerText = "Remplacer l'image (Optionnel)";
            }

            // Remonter automatiquement l'écran sur le formulaire
            document.getElementById('form-heading').scrollIntoView({ behavior: 'smooth' });
        }

        // RÉINITIALISER LE FORMULAIRE EN MODE CRÉATION INTÉGRALE
        function resetFormToCreateMode() {
            isEditMode = false;
            editEventId = null;
            editExistingImageUrl = null;

            document.getElementById('form-heading').innerHTML = `<i class="fa-solid fa-circle-plus mr-1"></i> Créer un Événement`;
            document.getElementById('btn-submit-event').innerText = "Générer mon Invitation";
            document.getElementById('btn-submit-event').className = "w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl transition text-sm tracking-wide mt-2 cursor-pointer";
            document.getElementById('btn-cancel-edit').classList.add('hidden');

            const slugInput = document.getElementById('event-slug-input');
            slugInput.disabled = false;
            slugInput.classList.remove('opacity-40');
            document.getElementById('slug-help-text').innerText = "Un identifiant unique y sera ajouté.";
            document.getElementById('file-label').innerText = "Image de fond (Max 2Mo)";

            document.getElementById('event-form').reset();
        }

        // SUPPRESSION SÉCURISÉE D'UN ÉVÉNEMENT
        async function deleteEvent(id, title) {
            const confirmation = confirm(`⚠️ Êtes-vous sûr de vouloir supprimer définitivement l'événement "${title}" ?\n\nCette action effacera également TOUTES les réponses des invités associées.`);
            if (!confirmation) return;

            // 1. Suppression des RSVP dépendants d'abord (Si ON DELETE CASCADE n'est pas actif dans PostgreSQL)
            await supabaseClient
                .from('rsvp')
                .delete()
                .eq('evenement_id', id);

            // 2. Suppression de l'événement principal
            const { error } = await supabaseClient
                .from('evenements')
                .delete()
                .eq('id', id);

            if (error) {
                alert("Erreur lors de la suppression : " + error.message);
            } else {
                alert("🗑️ L'événement a été supprimé avec succès.");
                if (isEditMode && editEventId === id) {
                    resetFormToCreateMode();
                }
                loadUserEvents();
            }
        }

        // TRAITEMENT ENVOI : AJOUT OU MODIFICATION (UPSERT LOGIC)
        document.getElementById('event-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('btn-submit-event');
            submitBtn.innerText = isEditMode ? "Enregistrement..." : "Création de l'invitation...";
            submitBtn.disabled = true;

            const titre = document.getElementById('event-title-input').value.trim();
            const type_evenement = document.getElementById('event-type-input').value;
            const date_heure = document.getElementById('event-date-input').value;
            const lieu = document.getElementById('event-location-input').value.trim();
            const lien_maps = document.getElementById('event-maps-input').value.trim();
            const couleur_theme = document.getElementById('event-theme-input').value;
            const hote = document.getElementById('event-host-input').value.trim();
            const phrase_invitation = document.getElementById('event-phrase-input').value.trim();
            
            const imageFile = document.getElementById('event-bg-file').files[0];
            let image_fond = isEditMode ? editExistingImageUrl : null;

            // Upload de la nouvelle image si elle est fournie
            if (imageFile) {
                const maxSizeInMB = 2;
                const maxSizeInBytes = maxSizeInMB * 1024 * 1024;

                if (imageFile.size > maxSizeInBytes) {
                    alert(`❌ L'image est trop lourde ! La taille maximale autorisée est de ${maxSizeInMB} Mo.`);
                    document.getElementById('event-bg-file').value = ""; 
                    submitBtn.innerText = isEditMode ? "Enregistrement..." : "Générer mon Invitation";
                    submitBtn.disabled = false;
                    return; 
                }

                const fileExt = imageFile.name.split('.').pop();
                const fileName = `${Date.now()}-${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
                const filePath = `${currentUser.id}/${fileName}`;

                const { data: uploadData, error: uploadError } = await supabaseClient
                    .storage
                    .from('fonds-invitations')
                    .upload(filePath, imageFile);

                if (uploadError) {
                    alert("Erreur lors du chargement de la nouvelle image : " + uploadError.message);
                    submitBtn.innerText = isEditMode ? "Enregistrement..." : "Générer mon Invitation";
                    submitBtn.disabled = false;
                    return;
                }

                const { data: publicUrlData } = supabaseClient
                    .storage
                    .from('fonds-invitations')
                    .getPublicUrl(filePath);
                
                image_fond = publicUrlData.publicUrl;
            }

            if (isEditMode) {
                // EXÉCUTER UNE MISE À JOUR (UPDATE)
                const { error } = await supabaseClient
                    .from('evenements')
                    .update({
                        titre, 
                        type_evenement, 
                        date_heure, 
                        lieu, 
                        lien_maps: lien_maps || null, 
                        couleur_theme, 
                        image_fond,
                        hote: hote || null,
                        phrase_invitation: phrase_invitation || null
                    })
                    .eq('id', editEventId);

                if (error) {
                    alert("Erreur lors de la mise à jour : " + error.message);
                } else {
                    alert("✨ L'événement a été modifié avec succès !");
                    resetFormToCreateMode();
                    loadUserEvents();
                }

            } else {
                // EXÉCUTER UNE INSERTION CLASSIQUE (CREATE)
                let rawSlug = document.getElementById('event-slug-input').value.trim().toLowerCase();
                rawSlug = rawSlug.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                rawSlug = rawSlug.replace(/[^a-z0-9-]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
                
                if (!rawSlug) rawSlug = "evenement";
                const uniqueId = Math.floor(1000 + Math.random() * 9000); 
                const slug = `${rawSlug}-${uniqueId}`;

                const { error } = await supabaseClient
                    .from('evenements')
                    .insert([{
                        user_id: currentUser.id,
                        titre, 
                        type_evenement, 
                        date_heure, 
                        lieu, 
                        lien_maps: lien_maps || null, 
                        couleur_theme, 
                        image_fond,
                        slug,
                        hote: hote || null,
                        phrase_invitation: phrase_invitation || null
                    }]);

                if (error) {
                    alert("Erreur lors de la création : " + error.message);
                } else {
                    alert(`🎉 Félicitations ! Votre invitation a été configurée.\nLien généré : /index.html?e=${slug}`);
                    document.getElementById('event-form').reset();
                    loadUserEvents();
                }
            }

            submitBtn.innerText = isEditMode ? "Enregistrement..." : "Générer mon Invitation";
            submitBtn.disabled = false;
        });

        checkUserSession();
    </script>
</body>
</html>
